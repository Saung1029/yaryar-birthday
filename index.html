<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Yar Yar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Pinyon+Script&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#15110e; --night-2:#221a15;
  --ivory:#f8f3ea; --ivory-2:#efe6d6; --paper:#fffdf8;
  --ink:#2b231d; --muted:#857767;
  --gold:#c7a35a; --gold-hi:#ecd9a8; --gold-lo:#9b7a3a;
  --ribbon:#d8b4a0; --ribbon-hi:#f1d9cb; --ribbon-lo:#b48c78;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --script:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
  --sans:Montserrat,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(120% 80% at 50% 0%,#2b211a 0%,var(--night) 55%,#0d0a08 100%) fixed;
  color:var(--ivory);font-family:var(--serif);overflow-x:hidden;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#dust{position:fixed;inset:0;pointer-events:none;z-index:50}
.eyebrow{font-family:var(--sans);font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-hi);opacity:.85}
.script{font-family:var(--script);font-weight:400;line-height:1}
.hair{width:64px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px auto}

/* ---------- scene 1: the wrapped box ---------- */
#intro{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px;text-align:center;transition:opacity .9s ease}
#intro.gone{opacity:0;pointer-events:none}
#intro h1{font-size:clamp(46px,13vw,76px);color:var(--gold-hi);margin:10px 0 4px;text-shadow:0 2px 24px rgba(199,163,90,.35)}
#intro .sub{font-style:italic;font-size:19px;color:#d9ccb8;margin-bottom:38px}
.stage{position:relative;width:min(70vw,290px);aspect-ratio:1/1.02;margin-top:40px}
.box-body,.lid{position:absolute;left:50%;transform:translateX(-50%);border-radius:4px}
.box-body{
  bottom:0;width:88%;height:72%;
  background:linear-gradient(160deg,#fffaf1 0%,var(--ivory) 45%,#e6dac5 100%);
  box-shadow:0 30px 60px rgba(0,0,0,.55),inset 0 -14px 30px rgba(120,95,60,.12);
}
.lid{
  top:16%;width:96%;height:20%;z-index:3;
  background:linear-gradient(175deg,#fffdf7 0%,var(--ivory) 60%,#e4d7c1 100%);
  box-shadow:0 12px 22px rgba(0,0,0,.35);
  transition:transform 1.1s cubic-bezier(.5,-.2,.3,1) .55s,opacity .8s ease 1.1s;
}
.rib-v,.rib-h{position:absolute;background:linear-gradient(90deg,var(--ribbon-lo),var(--ribbon-hi) 45%,var(--ribbon) 70%,var(--ribbon-lo));transition:transform .7s cubic-bezier(.6,0,.4,1)}
.rib-v{left:50%;width:15%;margin-left:-7.5%;top:0;bottom:0}
.lid .rib-v{z-index:1}
.box-body .rib-v{transform-origin:top}
.rib-h{left:0;right:0;top:46%;height:13%;background:linear-gradient(180deg,var(--ribbon-lo),var(--ribbon-hi) 45%,var(--ribbon) 70%,var(--ribbon-lo));transform-origin:left}
.bow{position:absolute;left:50%;top:16%;width:62%;height:30%;transform:translate(-50%,-62%);z-index:5;cursor:pointer;transition:transform .3s ease}
.bow:hover{transform:translate(-50%,-64%) scale(1.03)}
.loop{position:absolute;top:8%;width:46%;height:74%;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(60% 55% at 50% 50%,var(--ribbon-lo) 0 34%,transparent 36%),linear-gradient(160deg,var(--ribbon-hi),var(--ribbon) 55%,var(--ribbon-lo));
  box-shadow:0 6px 14px rgba(0,0,0,.28);transition:transform .8s cubic-bezier(.6,0,.4,1),opacity .6s ease .2s}
.loop.l{left:2%;transform:rotate(-24deg)}
.loop.r{right:2%;transform:rotate(24deg)}
.knot{position:absolute;left:50%;top:30%;width:20%;height:42%;transform:translateX(-50%);border-radius:30%;
  background:linear-gradient(90deg,var(--ribbon-lo),var(--ribbon-hi),var(--ribbon-lo));box-shadow:0 4px 10px rgba(0,0,0,.3);transition:transform .6s ease,opacity .5s ease .2s}
.tail{position:absolute;top:58%;width:13%;height:88%;background:linear-gradient(90deg,var(--ribbon-lo),var(--ribbon-hi),var(--ribbon));
  clip-path:polygon(0 0,100% 0,100% 100%,50% 86%,0 100%);transform-origin:top center;transition:transform 1s cubic-bezier(.6,0,.4,1),opacity .8s ease .3s}
.tail.l{left:38%;transform:rotate(18deg)}
.tail.r{right:38%;transform:rotate(-18deg)}
.tag{position:absolute;right:-4%;top:36%;z-index:6;width:84px;padding:18px 6px 9px;background:var(--paper);color:var(--ink);
  font-family:var(--script);font-size:21px;border-radius:3px;transform:rotate(9deg);box-shadow:0 8px 18px rgba(0,0,0,.4);transition:transform .9s ease,opacity .6s ease}
.tag::before{content:"";position:absolute;left:50%;top:5px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;border:1px solid var(--gold)}
.tag small{display:block;font-family:var(--sans);font-size:8px;letter-spacing:.25em;color:var(--muted);margin-top:8px}
.hint{margin-top:44px;font-family:var(--sans);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-hi);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.glow{position:absolute;left:50%;top:38%;width:10%;height:10%;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,236,190,.95),rgba(236,217,168,.4) 40%,transparent 70%);opacity:0;transition:all 1.2s ease 1.1s;z-index:2}

/* anticipation shake, then untie */
.wiggle{animation:wiggle .5s ease-in-out}
@keyframes wiggle{0%,100%{transform:none}20%{transform:rotate(-4deg) scale(1.03)}40%{transform:rotate(4deg) scale(1.05)}60%{transform:rotate(-3deg) scale(1.04)}80%{transform:rotate(2deg) scale(1.02)}}
.stage.untied{animation:hop .7s cubic-bezier(.3,1.6,.5,1) .55s}
@keyframes hop{0%{transform:none}35%{transform:translateY(-14px) scale(1.04,.97)}70%{transform:translateY(2px) scale(.98,1.02)}100%{transform:none}}
.untied .lid{transition:transform 1s cubic-bezier(.3,1.4,.5,1) .55s,opacity .7s ease 1.3s}
/* untied */
.untied .loop.l{transform:translate(-80%,-30%) rotate(-120deg) scale(.4);opacity:0}
.untied .loop.r{transform:translate(80%,-30%) rotate(120deg) scale(.4);opacity:0}
.untied .knot{transform:translateX(-50%) scale(0);opacity:0}
.untied .tail.l{transform:translate(-90%,60%) rotate(70deg);opacity:0}
.untied .tail.r{transform:translate(90%,60%) rotate(-70deg);opacity:0}
.untied .rib-h{transform:scaleX(0);transition-delay:.25s}
.untied .rib-v{transform:scaleY(0);transition-delay:.35s}
.untied .tag{transform:translate(60%,120%) rotate(40deg);opacity:0}
.untied .lid{transform:translate(-50%,-190%) rotate(-14deg);opacity:0}
.untied .glow{width:190%;height:190%;opacity:1}
.untied .hint{opacity:0;animation:none}

/* ---------- scene 2: the cabinet ---------- */
#cabinet{display:none;opacity:0;transition:opacity 1s ease;padding:56px 16px 64px;max-width:760px;margin:0 auto;text-align:center}
#cabinet.show{opacity:1}
#cabinet h2{font-size:clamp(44px,12vw,72px);color:var(--gold-hi);margin:12px 0 6px;text-shadow:0 2px 24px rgba(199,163,90,.3)}
#cabinet .lede{font-style:italic;font-size:19px;color:#d9ccb8}
.chest{margin:34px auto 0;padding:14px;border-radius:8px;
  background:linear-gradient(180deg,#3a2c22,#251b15);box-shadow:0 30px 70px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
  border:1px solid rgba(199,163,90,.35)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.drawer{position:relative;aspect-ratio:1/0.82;border-radius:4px;color:var(--ink);text-align:center;
  background:linear-gradient(170deg,#fffbf3 0%,var(--ivory) 55%,var(--ivory-2) 100%);
  box-shadow:inset 0 0 0 1px rgba(155,122,58,.35),inset 0 0 0 7px var(--ivory),inset 0 0 0 8px rgba(155,122,58,.28),0 6px 14px rgba(0,0,0,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 10px;
  transition:transform .35s cubic-bezier(.3,.7,.3,1),box-shadow .35s ease,filter .3s}
.drawer:hover{transform:translateY(-2px)}
.drawer.pull{transform:translateY(10px) scale(1.04);box-shadow:inset 0 0 0 1px rgba(155,122,58,.35),inset 0 0 0 7px var(--ivory),inset 0 0 0 8px rgba(155,122,58,.28),0 22px 30px rgba(0,0,0,.55)}
.drawer .num{font-family:var(--serif);font-size:15px;letter-spacing:.2em;color:var(--gold-lo)}
.drawer .ttl{font-family:var(--serif);font-size:clamp(17px,4.6vw,21px);font-weight:500;line-height:1.15;margin:6px 0 12px}
.handle{width:46%;height:9px;border-radius:9px;background:linear-gradient(180deg,var(--gold-hi),var(--gold) 50%,var(--gold-lo));box-shadow:0 2px 3px rgba(0,0,0,.35)}
.drawer .state{position:absolute;bottom:9px;left:0;right:0;font-family:var(--sans);font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);opacity:0;transition:opacity .4s}
.drawer.opened{background:linear-gradient(170deg,#f3ead9,#e8dcc6)}
.drawer.opened .state{opacity:1}
.drawer.opened .state::before{content:"\2713\00a0 "; color:var(--gold-lo)}
.golden{grid-column:1/-1;aspect-ratio:auto;min-height:136px;padding-bottom:28px;margin-top:2px;color:#3b2a10;
  background:linear-gradient(120deg,#9b7a3a,#d9bd7c 30%,#f3e3b6 50%,#d9bd7c 70%,#9b7a3a);background-size:220% 100%;
  box-shadow:inset 0 0 0 1px rgba(255,240,200,.6),inset 0 0 0 7px rgba(255,240,200,.08),inset 0 0 0 8px rgba(90,60,20,.35),0 8px 18px rgba(0,0,0,.45)}
.golden .num{color:#5a4117}
.golden .handle{background:linear-gradient(180deg,#fff4d6,#c9a35b 50%,#7d5d25);width:26%}
.golden.locked{filter:saturate(.35) brightness(.72);cursor:default}
.golden.locked:hover{transform:none}
.golden.ready{animation:sheen 3s linear infinite}
@keyframes sheen{to{background-position:-220% 0}}
.golden .state{opacity:1;color:#4b3615}
.foot{margin-top:30px;font-family:var(--sans);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#a99780}
.foot b{color:var(--gold-hi);font-weight:500}

/* ---------- modal ---------- */
.veil{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(10,7,5,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .45s ease}
.veil.open{opacity:1;pointer-events:auto}
.card{position:relative;width:100%;max-width:440px;max-height:calc(100svh - 32px);overflow:auto;border-radius:6px;color:var(--ink);text-align:center;
  background:var(--paper);box-shadow:0 40px 80px rgba(0,0,0,.6);padding:18px 18px 22px;
  transform:translateY(24px) scale(.97);transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.veil.open .card{transform:none}
.card::before{content:"";position:absolute;inset:8px;border:1px solid rgba(155,122,58,.35);border-radius:3px;pointer-events:none}
.photo{position:relative;background:#fff;border-radius:3px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo img{max-width:100%;max-height:100%;object-fit:contain;display:block;animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.thumbs{display:flex;justify-content:center;gap:8px;margin-top:10px}
.thumbs button{width:52px;height:52px;border-radius:3px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgba(155,122,58,.3);opacity:.6;transition:opacity .2s,box-shadow .2s}
.thumbs button.on{opacity:1;box-shadow:0 0 0 1.5px var(--gold)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.card .num{margin-top:18px;font-size:14px;letter-spacing:.24em;color:var(--gold-lo)}
.card h3{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.1;margin:6px 0 8px}
.items{font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);line-height:1.9}
.wish{font-style:italic;font-size:20px;line-height:1.45;color:#3d3229;margin:16px 6px 4px}
.actions{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.btn{font-family:var(--sans);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;padding:13px 18px;border-radius:2px;border:1px solid rgba(155,122,58,.55);color:var(--ink);transition:background .2s}
.btn:hover{background:var(--ivory)}
.btn.solid{background:var(--ink);border-color:var(--ink);color:var(--gold-hi)}
.btn.solid:hover{background:#40342b}
.x{position:absolute;right:14px;top:12px;z-index:2;width:34px;height:34px;font-size:22px;line-height:34px;color:var(--muted)}

/* final letter */
.card.letter{max-width:520px;padding:26px 22px 26px}
.polaroids{position:relative;height:300px;margin:4px auto 6px;max-width:360px}
.pol{position:absolute;left:50%;top:6px;width:210px;padding:10px 10px 38px;background:#fff;box-shadow:0 14px 30px rgba(0,0,0,.28);transform:translateX(-50%) rotate(-3deg)}
.pol img,.pol .ph{width:100%;aspect-ratio:1/1.08;object-fit:cover;display:block}
.pol .ph{background:linear-gradient(150deg,#f3e9d8,#e4d3b6);display:flex;align-items:center;justify-content:center;font-family:var(--script);font-size:64px;color:var(--gold-lo)}
.pol .cap{position:absolute;left:0;right:0;bottom:9px;font-family:var(--script);font-size:22px;color:var(--ink)}
.pol.s1{width:150px;transform:translateX(-118%) rotate(-11deg);top:44px;padding-bottom:14px}
.pol.s2{width:150px;transform:translateX(18%) rotate(9deg);top:52px;padding-bottom:14px}
.letter h3{font-family:var(--script);font-weight:400;font-size:clamp(36px,10vw,52px);white-space:nowrap;color:var(--gold-lo);margin:8px 0 4px}
.letter .body{text-align:left;font-size:19px;line-height:1.6;color:#352b23;margin:14px 6px 0}
.letter .body p+p{margin-top:12px}
.letter .sign{text-align:right;font-family:var(--script);font-size:32px;color:var(--ink);margin:14px 10px 0}
.ship{margin-top:18px;font-family:var(--sans);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

</style>
</head>
<body>
<canvas id="dust" aria-hidden="true"></canvas>

<!-- Scene 1 -->
<section id="intro">
  <div class="eyebrow">A birthday box for</div>
  <h1 class="script">Yar Yar</h1>
  <p class="sub">The real one is still on its way. Open this one first.</p>
  <div class="stage" id="stage">
    <div class="glow"></div>
    <div class="box-body"><div class="rib-v"></div><div class="rib-h"></div></div>
    <div class="lid"><div class="rib-v"></div></div>
    <button class="bow" id="bow" aria-label="Untie the ribbon">
      <span class="tail l"></span><span class="tail r"></span>
      <span class="loop l"></span><span class="loop r"></span>
      <span class="knot"></span>
    </button>
    <div class="tag">Yar Yar<small>WITH LOVE</small></div>
  </div>
  <div class="hint" id="hint">Tap the ribbon to untie</div>
</section>

<!-- Scene 2 -->
<section id="cabinet" aria-live="polite">
  <div class="eyebrow">Happy Birthday</div>
  <h2 class="script">Yar Yar</h2>
  <p class="lede">Six drawers, six gifts. Open them in any order.</p>
  <div class="hair"></div>
  <div class="chest"><div class="grid" id="grid"></div></div>
  <p class="foot" id="progress"></p>
  <p class="foot" style="margin-top:10px">Your real box is on its way to you</p>
</section>

<!-- Modal -->
<div class="veil" id="veil" role="dialog" aria-modal="true">
  <div class="card" id="card"></div>
</div>

let W, H, motes = [], sparks = [];
const GOLD = ['#ecd9a8','#c7a35a','#fff4d6','#e8c9a0'];
const PALS = [GOLD, ['#fff4d6','#f1d9cb','#d8b4a0','#ffffff'], ['#ffffff','#ecd9a8','#f3e3b6'], ['#e9b8a8','#f1d9cb','#ecd9a8']];
const PAPER = ['#f3e3b6','#c7a35a','#fffdf8','#e9c9b5','#d8b4a0','#b8935a','#ecd9a8'];
const rnd = (a,b) => a + Math.random()*(b-a);
function firework(x,y){
  const pal = PALS[Math.random()*PALS.length|0], n = rnd(70,110)|0, sp = rnd(3,5.2);
  sparks.push({k:'flash',x,y,life:1});
  for (let i=0;i<n;i++){ const t = i/n*Math.PI*2 + rnd(-.05,.05), s = sp*rnd(.55,1);
    sparks.push({k:'f',x,y,px:x,py:y,vx:Math.cos(t)*s,vy:Math.sin(t)*s,life:1,decay:rnd(.010,.018),r:rnd(1.2,2.2),c:pal[i%pal.length]}); }
}
function rocket(x,ty){ sparks.push({k:'r',x,y:H+10,vx:rnd(-.8,.8),vy:-Math.sqrt(2*.09*(H+10-ty)),life:1}); }
function popper(side){
  for (let i=0;i<80;i++){ const a = -Math.PI/2 + side*rnd(.12,.8), s = rnd(9,19);
    sparks.push({k:'p',x:side>0?0:W,y:H,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      w:rnd(6,11),h:rnd(3,6),rot:rnd(0,6),vr:rnd(-.2,.2),flip:rnd(0,6),vf:rnd(.08,.3),c:PAPER[i%PAPER.length],life:1}); }
}
function rain(n=140){
  for (let i=0;i<n;i++) sparks.push({k:'p',x:rnd(0,W),y:rnd(-260,-10),vx:rnd(-1,1),vy:rnd(1,3),
    w:rnd(6,11),h:rnd(3,6),rot:rnd(0,6),vr:rnd(-.15,.15),flip:rnd(0,6),vf:rnd(.08,.3),c:PAPER[i%PAPER.length],life:1});
}
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function size(){ const d = devicePixelRatio||1; W = innerWidth; H = innerHeight; cv.width = W*d; cv.height = H*d; cx.setTransform(d,0,0,d,0,0); }
size(); addEventListener('resize', size);
for (let i=0;i<(reduce?0:46);i++) motes.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,v:Math.random()*.25+.05,a:Math.random()*.5+.15,p:Math.random()*6});
function burst(x,y,n=90,spread=1){
  for (let i=0;i<n;i++){ const t=Math.random()*Math.PI*2, s=(Math.random()*6+2)*spread;
    sparks.push({x,y,vx:Math.cos(t)*s,vy:Math.sin(t)*s-3,life:1,r:Math.random()*2.6+.8,
      c:['#ecd9a8','#c7a35a','#fff4d6','#e8c9a0'][i%4], rect:Math.random()<.45, rot:Math.random()*6}); }
}
function frame(){
  cx.clearRect(0,0,W,H);
  for (const m of motes){ m.y -= m.v; m.p += .02; if (m.y < -5){ m.y = H+5; m.x = Math.random()*W; }
    cx.globalAlpha = m.a*(.6+.4*Math.sin(m.p)); cx.fillStyle = '#ecd9a8'; cx.beginPath(); cx.arc(m.x,m.y,m.r,0,7); cx.fill(); }
  sparks = sparks.filter(s => s.life > 0);
  const born = [];
  for (const s of sparks){
    if (s.k === 'r'){ // rocket climbing, explodes at apex
      s.x += s.vx; s.y += s.vy; s.vy += .09;
      if (Math.random() < .7) born.push({x:s.x+rnd(-1,1),y:s.y+4,vx:rnd(-.4,.4),vy:rnd(.5,1.5),life:.6,r:rnd(.6,1.3),c:'#ecd9a8'});
      cx.globalAlpha = 1; cx.fillStyle = '#fff4d6'; cx.beginPath(); cx.arc(s.x,s.y,2.2,0,7); cx.fill();
      if (s.vy >= -.6){ s.life = 0; firework(s.x,s.y); }
      continue; }
    if (s.k === 'flash'){ s.life -= .07; const R = 20 + 70*(1-s.life);
      const g = cx.createRadialGradient(s.x,s.y,0,s.x,s.y,R); g.addColorStop(0,'rgba(255,244,214,.9)'); g.addColorStop(1,'rgba(255,244,214,0)');
      cx.globalAlpha = Math.max(s.life,0)*.7; cx.fillStyle = g; cx.beginPath(); cx.arc(s.x,s.y,R,0,7); cx.fill(); continue; }
    if (s.k === 'f'){ // firework star with a short trail, twinkles as it fades
      s.px = s.x; s.py = s.y; s.x += s.vx; s.y += s.vy; s.vy += .045; s.vx *= .976; s.vy *= .976; s.life -= s.decay;
      if (s.life < .35 && Math.random() < .4) continue;
      cx.globalAlpha = Math.max(s.life,0); cx.strokeStyle = s.c; cx.lineWidth = s.r; cx.lineCap = 'round';
      cx.beginPath(); cx.moveTo(s.px - s.vx*2.5, s.py - s.vy*2.5); cx.lineTo(s.x,s.y); cx.stroke(); continue; }
    if (s.k === 'p'){ // paper confetti: drag, flutter, slow fall
      s.vy += .22; s.vx *= .965; s.vy *= .965; s.flip += s.vf; s.rot += s.vr;
      s.x += s.vx + Math.sin(s.flip)*.7; s.y += s.vy;
      if (s.y > H + 30) s.life = 0;
      cx.globalAlpha = 1; cx.fillStyle = s.c; cx.save(); cx.translate(s.x,s.y); cx.rotate(s.rot); cx.scale(1, Math.cos(s.flip));
      cx.fillRect(-s.w/2,-s.h/2,s.w,s.h); cx.restore(); continue; }
    s.x += s.vx; s.y += s.vy; s.vy += .12; s.vx *= .985; s.life -= .011; s.rot = (s.rot||0) + .15;
    cx.globalAlpha = Math.max(s.life,0); cx.fillStyle = s.c;
    if (s.rect){ cx.save(); cx.translate(s.x,s.y); cx.rotate(s.rot); cx.fillRect(-s.r,-s.r*.4,s.r*2.2,s.r*.8); cx.restore(); }
    else { cx.beginPath(); cx.arc(s.x,s.y,s.r,0,7); cx.fill(); } }
  sparks.push(...born);
  cx.globalAlpha = 1; requestAnimationFrame(frame);
}
frame();

/* scene 1 -> 2 */
$('#bow').addEventListener('click', () => {
  const st = $('#stage'); if (st.classList.contains('untied')) return;
  $('#hint').style.animation = 'none'; $('#hint').style.opacity = 0;
  st.classList.add('wiggle');
  const r = st.getBoundingClientRect(), bx = r.left + r.width/2, by = r.top + r.height*.35;
  setTimeout(() => { st.classList.remove('wiggle'); st.classList.add('untied'); }, 520);
  setTimeout(() => { burst(bx, by, 160, 1.3); popper(1); popper(-1); }, 1500);
  [1700,2050,2350,2700,2950,3300,3600].forEach((t,i) =>
    setTimeout(() => rocket(rnd(.14,.86)*W, rnd(.1,.38)*H), t + (i%2)*60));
  setTimeout(() => { firework(W*.25, H*.22); firework(W*.75, H*.28); }, 4200);
  setTimeout(() => $('#intro').classList.add('gone'), 3900);
  setTimeout(() => { $('#intro').style.display = 'none'; const c = $('#cabinet'); c.style.display = 'block';
    scrollTo(0,0); requestAnimationFrame(() => c.classList.add('show')); rain(); }, 4700);
});

/* build drawers */
const grid = $('#grid');
GIFTS.forEach((g,i) => {
  const b = document.createElement('button');
  b.className = 'drawer'; b.dataset.i = i;
  b.innerHTML = `<span class="num">${g.num}</span><span class="ttl">${g.teaser}</span><span class="handle"></span><span class="state">Opened</span>`;
  b.setAttribute('aria-label', `Drawer ${g.num}: ${g.teaser}`);
  b.addEventListener('click', () => pull(b, () => openGift(i, b)));
  grid.appendChild(b);
});
const gold = document.createElement('button');
gold.className = 'drawer golden locked';
gold.innerHTML = `<span class="num">VII</span><span class="ttl">The Last Drawer</span><span class="handle"></span><span class="state" id="goldState"></span>`;
gold.addEventListener('click', () => { if (opened.size < GIFTS.length) { gold.animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:320}); return; }
  pull(gold, () => openLetter(gold)); });
grid.appendChild(gold);

function pull(el, then){ if (closing) return; el.classList.add('pull'); setTimeout(() => { then(); setTimeout(() => el.classList.remove('pull'), 350); }, 260); }
function refresh(){
  const n = opened.size, t = GIFTS.length;
  $('#progress').innerHTML = n < t ? `<b>${n}</b> of ${t} drawers opened` : `All six opened. <b>One more</b> is waiting.`;
  $('#goldState').textContent = n < t ? `Opens after the other six · ${n}/${t}` : `Open me`;
  if (n === t && gold.classList.contains('locked')){ gold.classList.remove('locked'); gold.classList.add('ready');
    const r = gold.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2, 70, .8); }
}
refresh();

/* modal */
const veil = $('#veil'), card = $('#card');
let origin = null, closing = false;
/* card flies between its drawer and the centre: peeks out of the drawer, arcs up, lands */
function fly(el, back){
  const d = el.getBoundingClientRect(), c = card.getBoundingClientRect();
  const dx = (d.left + d.width/2) - (c.left + c.width/2), dy = (d.top + d.height/2) - (c.top + c.height/2);
  const s = Math.min(d.width / c.width * .85, .6);
  const k = [
    {transform:`translate(${dx}px,${dy}px) scale(${s*.6})`, opacity:0, offset:0},
    {transform:`translate(${dx}px,${dy - d.height*.55}px) scale(${s}) rotate(3deg)`, opacity:1, offset:.28},
    {transform:`translate(${dx*.35}px,${dy*.35 - 50}px) scale(${(s+1)/2}) rotate(-4deg)`, opacity:1, offset:.62},
    {transform:'translate(0,-6px) scale(1.015)', opacity:1, offset:.86},
    {transform:'none', opacity:1, offset:1}];
  const frames = back ? k.slice().reverse().map(f => ({...f, offset:1 - f.offset})) : k;
  return card.animate(frames, {duration: back ? 620 : 1050, easing: back ? 'cubic-bezier(.5,0,.75,.4)' : 'cubic-bezier(.22,.9,.3,1)', fill: back ? 'forwards' : 'none'});
}
function show(from){
  origin = from || null; card.style.transition = 'none';
  veil.classList.add('open'); document.body.style.overflow = 'hidden';
  if (origin){ const a = fly(origin, false); a.onfinish = () => { card.style.transition = ''; }; }
}
function hide(){
  if (!veil.classList.contains('open')) return;
  card.getAnimations().forEach(a => a.cancel());
  card.style.transition = ''; veil.classList.remove('open'); document.body.style.overflow = '';
}
veil.addEventListener('click', e => { if (e.target === veil) hide(); });
addEventListener('keydown', e => { if (e.key === 'Escape') hide(); });

function openGift(i, from){
  const g = GIFTS[i];
  card.className = 'card';
  const thumbs = g.imgs.length > 1 ? `<div class="thumbs">${g.imgs.map((k,j)=>`<button class="${j?'':'on'}" data-k="${k}" aria-label="Photo ${j+1}"><img src="${IMAGES[k]}" alt=""></button>`).join('')}</div>` : '';
  const left = GIFTS.findIndex((_,j) => j !== i && !opened.has(j));
  const next = left >= 0 ? `<button class="btn solid" id="nextBtn">Next drawer</button>` : `<button class="btn solid" id="nextBtn">To the last drawer</button>`;
  card.innerHTML = `<button class="x" aria-label="Close">&times;</button>
    <div class="photo"><img id="main" src="${IMAGES[g.imgs[0]]}" alt="${g.title}"></div>${thumbs}
    <div class="num">${g.num}</div><h3>${g.title}</h3>
    <div class="items">${g.items.join('<br>')}</div>
    <p class="wish">${g.wish}</p>
    <div class="actions"><button class="btn" id="closeBtn">Close drawer</button>${next}</div>`;
  card.scrollTop = 0;
  card.querySelectorAll('.thumbs button').forEach(t => t.addEventListener('click', () => {
    card.querySelectorAll('.thumbs button').forEach(x => x.classList.remove('on')); t.classList.add('on');
    const m = $('#main'); m.style.animation = 'none'; m.offsetWidth; m.style.animation = ''; m.src = IMAGES[t.dataset.k]; }));
  card.querySelector('.x').onclick = hide; $('#closeBtn').onclick = hide;
  $('#nextBtn').onclick = () => { hide(); setTimeout(() => {
    if (left >= 0) grid.children[left].click(); else { gold.scrollIntoView({behavior:'smooth',block:'center'}); setTimeout(() => gold.click(), 500); } }, 480); };
  show(from);
  if (!opened.has(i)){ opened.add(i); grid.children[i].classList.add('opened');
    setTimeout(() => { const r = card.getBoundingClientRect(); burst(r.left + r.width/2, r.top + 40, 60, .8); }, 1000);
    refresh(); }
}

function openLetter(from){
  card.className = 'card letter';
  const main = PHOTOS[0] ? `<img src="${PHOTOS[0]}" alt="Yar Yar">` : `<div class="ph">Y</div>`;
  const side = PHOTOS.slice(1,3).map((p,j) => `<div class="pol s${j+1}"><img src="${p}" alt=""></div>`).join('');
  card.innerHTML = `<button class="x" aria-label="Close">&times;</button>
    <div class="eyebrow" style="color:var(--gold-lo);margin-top:6px">Drawer VII</div>
    <div class="polaroids" style="${PHOTOS.length ? '' : 'height:290px'}">${side}<div class="pol">${main}<div class="cap">Yar Yar</div></div></div>
    <h3>Happy Birthday</h3>
    <div class="body"><p>${LETTER.greeting}</p>${LETTER.paragraphs.map(p=>`<p>${p}</p>`).join('')}</div>
    <div class="sign">${LETTER.sign}</div>
    <div class="ship">Your real box is on its way</div>
    <div class="actions"><button class="btn" id="closeBtn">Close</button><button class="btn solid" id="replay">Wrap it again</button></div>`;
  card.scrollTop = 0;
  card.querySelector('.x').onclick = hide; $('#closeBtn').onclick = hide;
  $('#replay').onclick = () => location.reload();
  show(from);
  const fire = () => { burst(W*.2, H*.35, 110, 1.1); burst(W*.8, H*.35, 110, 1.1); };
  setTimeout(fire, 400); setTimeout(() => burst(W*.5, H*.25, 140, 1.3), 1300);
}
</script>
</body>
</html>
